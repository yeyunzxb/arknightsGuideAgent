<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8f9f7">
    <title>PRTS · 明日方舟知识助手</title>
    <script>
      (() => {
        let theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        try { const saved = localStorage.getItem('prts-theme'); if (saved === 'light' || saved === 'dark') theme = saved; } catch {}
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#1b2320' : '#f8f9f7';
      })();
    </script>
  </head>
  <body><div id="app"></div><script type="module" src="/src/main.js"></script></body>
</html>
